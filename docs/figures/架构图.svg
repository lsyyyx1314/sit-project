<svg xmlns="http://www.w3.org/2000/svg" width="920" height="560" viewBox="0 0 920 560" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#4a5a7a"/>
    </marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="920" height="560" fill="#f8fafc"/>
  <text x="460" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">MPV-2 系统架构 · SDN 多路径验证</text>

  <!-- 数据平面大框 -->
  <rect x="30" y="60" width="860" height="230" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="50" y="85" font-size="14" font-weight="700" fill="#1d4ed8">数据平面（Linux netns + veth，用户态 AF_PACKET 交换机）</text>

  <!-- 主机 -->
  <rect x="55" y="150" width="86" height="52" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="98" y="172" text-anchor="middle" font-size="13" font-weight="600" fill="#166534">主机 h1</text>
  <text x="98" y="190" text-anchor="middle" font-size="10" fill="#166534">10.0.0.1</text>
  <rect x="789" y="150" width="86" height="52" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="832" y="172" text-anchor="middle" font-size="13" font-weight="600" fill="#166534">主机 h2</text>
  <text x="832" y="190" text-anchor="middle" font-size="10" fill="#166534">10.0.0.2</text>

  <!-- 交换机 -->
  <rect x="205" y="150" width="90" height="52" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="250" y="172" text-anchor="middle" font-size="13" font-weight="600" fill="#1e3a8a">交换机 s1</text>
  <text x="250" y="190" text-anchor="middle" font-size="10" fill="#1e3a8a">V += c₁·ρ⁰</text>
  <rect x="370" y="95" width="90" height="52" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="415" y="117" text-anchor="middle" font-size="13" font-weight="600" fill="#1e3a8a">交换机 s2</text>
  <text x="415" y="135" text-anchor="middle" font-size="10" fill="#1e3a8a">V += c₂·ρ¹</text>
  <rect x="370" y="215" width="90" height="52" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="415" y="237" text-anchor="middle" font-size="13" font-weight="600" fill="#1e3a8a">交换机 s3</text>
  <text x="415" y="255" text-anchor="middle" font-size="10" fill="#1e3a8a">V += c₃′·ρ¹</text>
  <rect x="540" y="150" width="90" height="52" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="585" y="172" text-anchor="middle" font-size="13" font-weight="600" fill="#1e3a8a">交换机 s4</text>
  <text x="585" y="190" text-anchor="middle" font-size="10" fill="#1e3a8a">V += c₄·ρ² 剥离</text>

  <!-- 转发表/密钥小标注 -->
  <rect x="205" y="238" width="150" height="34" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text x="280" y="259" text-anchor="middle" font-size="10" fill="#475569">转发表热加载 · 端口密钥 K(sid,in,out)</text>

  <!-- 数据平面链路 -->
  <line x1="141" y1="176" x2="205" y2="176" stroke="#2563eb" stroke-width="2" marker-end="url(#arrb)"/>
  <line x1="295" y1="166" x2="370" y2="126" stroke="#2563eb" stroke-width="2" marker-end="url(#arrb)"/>
  <line x1="295" y1="186" x2="370" y2="236" stroke="#2563eb" stroke-width="2" marker-end="url(#arrb)"/>
  <line x1="460" y1="121" x2="540" y2="166" stroke="#2563eb" stroke-width="2" marker-end="url(#arrb)"/>
  <line x1="460" y1="241" x2="540" y2="186" stroke="#2563eb" stroke-width="2" marker-end="url(#arrb)"/>
  <line x1="630" y1="176" x2="789" y2="176" stroke="#2563eb" stroke-width="2" marker-end="url(#arrb)"/>
  <text x="357" y="200" font-size="10" fill="#1e40af">P0</text>
  <text x="357" y="238" font-size="10" fill="#1e40af">P1</text>

  <!-- 验证头垫片说明 -->
  <rect x="650" y="228" width="225" height="44" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text x="762" y="246" text-anchor="middle" font-size="10.5" fill="#334155">16B 验证头垫片（ethertype 0x88B5）</text>
  <text x="762" y="263" text-anchor="middle" font-size="10" fill="#64748b">nonce 56b ｜ V 64b ｜ tag 8b，恒定不膨胀</text>

  <!-- 上报通道 -->
  <path d="M 585 202 C 585 330, 460 330, 400 350" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arr)"/>
  <text x="505" y="322" font-size="11" fill="#b45309">上报：逐包 / FLOW 流级窗口 / TRACE 逐跳取证</text>

  <!-- 控制平面大框 -->
  <rect x="30" y="350" width="860" height="180" rx="10" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="50" y="375" font-size="14" font-weight="700" fill="#a16207">控制平面（控制器，C++ 进程）</text>

  <rect x="55" y="395" width="190" height="100" rx="8" fill="#ffffff" stroke="#ca8a04" stroke-width="1.2"/>
  <text x="150" y="417" text-anchor="middle" font-size="12.5" font-weight="600" fill="#713f12">期望表 ExpectationTable</text>
  <text x="150" y="437" text-anchor="middle" font-size="10.5" fill="#78716c">E(h)=A+ B·h（与 nonce 无关）</text>
  <text x="150" y="455" text-anchor="middle" font-size="10.5" fill="#78716c">CPMV：tag 一次判定 O(1)</text>
  <text x="150" y="473" text-anchor="middle" font-size="10.5" fill="#78716c">BPMV：scan 兜底 O(k)</text>

  <rect x="290" y="395" width="200" height="100" rx="8" fill="#ffffff" stroke="#ca8a04" stroke-width="1.2"/>
  <text x="390" y="417" text-anchor="middle" font-size="12.5" font-weight="600" fill="#713f12">CFMV 流级判定</text>
  <text x="390" y="437" text-anchor="middle" font-size="10.5" fill="#78716c">N·A + B·Σh ≡ ΣV</text>
  <text x="390" y="455" text-anchor="middle" font-size="10.5" fill="#78716c">每窗口一次，与 N 无关</text>
  <text x="390" y="473" text-anchor="middle" font-size="10.5" fill="#78716c">NonceWindow 重放去重</text>

  <rect x="535" y="395" width="160" height="100" rx="8" fill="#ffffff" stroke="#ca8a04" stroke-width="1.2"/>
  <text x="615" y="417" text-anchor="middle" font-size="12.5" font-weight="600" fill="#713f12">取证定位</text>
  <text x="615" y="437" text-anchor="middle" font-size="10.5" fill="#78716c">逐跳对照累计期望</text>
  <text x="615" y="455" text-anchor="middle" font-size="10.5" fill="#78716c">多故障：改道跳+篡改跳</text>
  <text x="615" y="473" text-anchor="middle" font-size="10.5" fill="#78716c">黑洞：取证差集</text>

  <rect x="740" y="395" width="125" height="100" rx="8" fill="#ffffff" stroke="#ca8a04" stroke-width="1.2"/>
  <text x="802" y="417" text-anchor="middle" font-size="12.5" font-weight="600" fill="#713f12">场景编排</text>
  <text x="802" y="437" text-anchor="middle" font-size="10.5" fill="#78716c">7 场景 · 热加载</text>
  <text x="802" y="455" text-anchor="middle" font-size="10.5" fill="#78716c">故障切换/重路由</text>
  <text x="802" y="473" text-anchor="middle" font-size="10.5" fill="#78716c">e2e · dashboard · exp</text>

  <!-- 控制器下发流表 -->
  <path d="M 280 395 C 280 320, 300 290, 285 204" fill="none" stroke="#16a34a" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arr)"/>
  <text x="150" y="330" font-size="11" fill="#15803d">下发候选路径集 / 转发表（故障切换时收敛为 {P1}）</text>

  <!-- 密钥体系说明 -->
  <rect x="30" y="535" width="860" height="18" rx="4" fill="#e2e8f0"/>
  <text x="460" y="548" text-anchor="middle" font-size="10.5" fill="#475569">密钥体系：seed → K(sid) ⊕ K(in) ⊕ K(out) → (a_i, b_i)；单跳贡献 c_i = (a_i + b_i·H(nonce)) mod p，p = 2⁶⁴ − 59</text>
</svg>
